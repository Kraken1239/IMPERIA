# Trial deployment: both resources use the free plan. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: imperia-aktau
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: imperia-aktau-db
          property: connectionString
      - key: IMPERIA_ADMIN_KEY
        generateValue: true
databases:
  - name: imperia-aktau-db
    plan: free
    region: frankfurt
    databaseName: imperia
    user: imperia
    ipAllowList: []
